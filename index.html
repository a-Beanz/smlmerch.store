<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SMLMERCH.STORE</title>
<meta name="description" content="We are SML Merch store!! Buy Jeff puppet todayu!! Officialy store of Small Medium Large!! Not SuperMarioLogan don't C&D me please 🥺🥺 >.<">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(to bottom, #8b0000 0%, #2a0000 70%, #000000 100%);
        overflow: hidden;
        cursor: url('assets/cursor.png'), auto;
    }

    .sprite-container {
        position: relative;
        width: 512px;
        height: 512px;
        transform: scale(1.6);
    }

    .sprite-container img {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: 100%;
        max-height: 100%;
        pointer-events: none;
    }

    .layer0 { z-index: 0; }
    .layer1 { 
        z-index: 1;
        animation: shake 0.5s infinite;
    }
    .layer2 { 
        z-index: 2;
        animation: shake 0.1s infinite;
    }

    /* KILL ME THERE HAS TO BE A BETTER WAY TO DO THIS */
    @keyframes shake {
        0%   { transform: translate(-50%, -50%) translate(0, 0); }
        10%  { transform: translate(-50%, -50%) translate(-1px, 1px); }
        20%  { transform: translate(-50%, -50%) translate(1px, -1px); }
        30%  { transform: translate(-50%, -50%) translate(-1px, -1px); }
        40%  { transform: translate(-50%, -50%) translate(1px, 1px); }
        50%  { transform: translate(-50%, -50%) translate(-0.5px, 1px); }
        60%  { transform: translate(-50%, -50%) translate(1px, 0); }
        70%  { transform: translate(-50%, -50%) translate(-1px, 0); }
        80%  { transform: translate(-50%, -50%) translate(0, 1px); }
        90%  { transform: translate(-50%, -50%) translate(0, -1px); }
        100% { transform: translate(-50%, -50%) translate(0, 0); }
    }
    /* ^ chatgpt please generate me a random jitter effect make no mistakes */

    marquee {
        position: fixed;
        width: 100%;
        font-family: 'Cormorant', serif;
        font-size: 30px;
        color: rgba(255, 255, 255, 1);
        z-index: 100;
    }

    .mar-my-quee-bottom {
        bottom: 0;
    }

    /* autoplay disclaimer  */
    .autoplay-interaction-requirement {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        transition: opacity 0.5s ease-out;
    }

    .autoplay-interaction-requirement.fade-out {
        opacity: 0;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }

    .autoplay-disclaimer {
        font-family: 'Cormorant', serif;
        font-size: 32px;
        color: white;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        animation: fadeIn 3s ease-in forwards;
    }

    /* logo */
    .smlmerch-logo {
        position: fixed;
        top: 15px;
        left: 15px;
        width: 250px;
        z-index: 200;
        transform-origin: 50% 50%;
        animation: funny-bootleg-logo-animation 3s ease-in-out infinite;
        pointer-events: none;
    }

    /* the little kanade gif at the bottom right with the really messed up positioning tricks hiiiii */
    .kanadeyayayayaa {
        position: fixed;
        bottom: -50px;
        right: 15px;
        width: 150px;
        z-index: 500;
        transform-origin: 50% 50%;
    }

    @keyframes funny-bootleg-logo-animation {
        0%   { transform: rotate(-4deg); }
        50%  { transform: rotate(8deg); }
        100% { transform: rotate(-4deg); }
    }

</style>
</head>

<body>

<div class="autoplay-interaction-requirement" id="autoplay-interaction-requirement">
    <div class="autoplay-disclaimer">Click or tap anywhere on the screen to continue.</div>
</div>

<img src="assets/smlmerchstorelogo1_1.webp" class="smlmerch-logo" alt="Logo">

<!-- shortcut that i may remove later -->
<a href="https://yumekana.de/" class="kanadeyayayayaa">
    <img src="assets/kanade.gif" alt="Shortcut to https://yumekana.de">
</a>

<marquee class="mar-my-quee-bottom" direction="left" scrollamount="6"></marquee>

<div class="sprite-container">
    <img src="assets/mmain-layer0.png" class="layer0">
    <img src="assets/mmain-layer1.png" class="layer1">
    <img src="assets/mmain-layer2.png" class="layer2">
</div>

<script>
fetch('assets/marquee.txt')
    .then(response => response.text())
    .then(text => {
        // web development is my passion
        document.querySelector('.mar-my-quee-bottom').textContent = text;
    });

const overlay = document.getElementById('autoplay-interaction-requirement');
const disclaimer = document.querySelector('.autoplay-disclaimer');

function dismissAutoplayOverlay() {
    disclaimer.remove();
    overlay.classList.add('fade-out');
    overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
}

overlay.addEventListener('click', dismissAutoplayOverlay, { once: true });
overlay.addEventListener('touchstart', dismissAutoplayOverlay, { once: true });

window.addEventListener("click", () => {
    const audio = new Audio("assets/hellscape.mp3");
    audio.loop = true;
    audio.play();
}, { once: true });

</script>

</body>
</html>
