<!DOCTYPE html>
<html lang="en">
    
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hi i'm lou from sml metch store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant&display=swap" rel="stylesheet">

<style>
    :root {
        --target-rotation: 4320deg;
        --target-scale: 0.5;
    }

    html, body {
        background: black;
        height: 100%;
        margin: 0;
        overflow: hidden;
        width: 100%;
    }

    body.go .lou.opening {
        animation: 
            newspaper-spin 1.65s linear 0.5s forwards,
            lou-squish 1s cubic-bezier(0.34, 1.56, 0.64, 1) 2.15s forwards;
    }

    /* autoplay disclaimer  */
    .autoplay-interaction-requirement {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        transition: opacity 0.5s ease-out;
    }

    .autoplay-interaction-requirement.fade-out {
        opacity: 0;
    }

    .autoplay-disclaimer {
        font-family: 'Cormorant', serif;
        font-size: 32px;
        color: white;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        animation: fadeIn 3s ease-in forwards;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }

    /* Lou */
    .container {
        align-items: center;
        display: flex;
        inset: 0;
        justify-content: center;
        position: fixed;
    }

    .lou {
        height: auto;
        opacity: 0;
        transform: rotate(0deg) scale(0);
        width: 50vmin;
        user-select: none;
        -drag: none;
        -moz-user-select: none;
        -webkit-user-drag: none;
        -webkit-user-select: none;
    }

    .lou.finished {
        opacity: 1;
        transform: rotate(var(--target-rotation)) scale(var(--target-scale));
    }

    .lou.squish-manual {
        animation: lou-squish-manual 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes lou-squish {
        0% { transform: rotate(var(--target-rotation)) scale(calc(var(--target-scale) * 2), calc(var(--target-scale) * 0.1)); }
        100% { transform: rotate(var(--target-rotation)) scale(var(--target-scale), var(--target-scale)); }
    }

    @keyframes lou-squish-manual {
        0% { transform: rotate(var(--target-rotation)) scale(var(--target-scale), var(--target-scale)); }
        50% { transform: rotate(var(--target-rotation)) scale(calc(var(--target-scale) * var(--squish-x)), calc(var(--target-scale) * var(--squish-y))); }
        100% { transform: rotate(var(--target-rotation)) scale(var(--target-scale), var(--target-scale)); }
    }

    @keyframes newspaper-spin {
        from {
            opacity: 1;
            transform: rotate(0deg) scale(calc(var(--target-scale) * 0.1), calc(var(--target-scale) * 2.2));
        }
        to {
            opacity: 1;
            transform: rotate(var(--target-rotation)) scale(calc(var(--target-scale) * 2), calc(var(--target-scale) * 0.1));
        }
    }

    /* Marquee */
    marquee {
        position: fixed;
        width: 100%;
        font-family: 'Cormorant', serif;
        font-size: 30px;
        color: rgba(255, 255, 255, 1);
        z-index: 0;
    }

    .mar-my-quee-bottom {
        bottom: 0;
    }
</style>
</head>

<body>
    
<div class="autoplay-interaction-requirement" id="autoplay-interaction-requirement">
    <div class="autoplay-disclaimer">Click or tap anywhere on the screen to continue.</div>
</div>

<div class="container">
    <img class="lou opening" id="lou" src="lou.jpg" alt="A weird edited image of Marvin from SML. Presumably AI?">
</div>

<marquee class="mar-my-quee-bottom" direction="left" scrollamount="6"></marquee>

<audio id="scream" src="scream.mp3" preload="auto"></audio>
<audio id="slap" src="slap.wav" preload="auto"></audio>
<audio id="spin" src="woosh 1.65 seconds.wav" preload="auto"></audio>

<script>
    const disclaimer = document.querySelector('.autoplay-disclaimer');

    const louObject = document.getElementById('lou');
    const overlay = document.getElementById('autoplay-interaction-requirement');
    const scream = document.getElementById('scream');
    const slap = document.getElementById('slap');
    const spin = document.getElementById('spin');

    let canSlapLou = false;

    function dismissAutoplayOverlay() {
        disclaimer.remove();
        overlay.classList.add('fade-out');
        overlay.addEventListener('transitionend', () => overlay.remove(), { once: true });
    };

    // Only play spin audio while newspaper-spin animation plays
    louObject.addEventListener('animationstart', (e) => {
        if (e.animationName === 'newspaper-spin') spin.play();
    });

    function begin() {
        // marquee
        document.querySelector('.mar-my-quee-bottom').textContent = "I am lou fro mthe super mario lgan merch store";

        // Lou animation
        [scream, slap, spin].forEach(audio => {
            audio.muted = true;
            audio.play().then(() => {
                    audio.pause();
                    audio.currentTime = 0;
                    audio.muted = false;
                })
        });

        overlay.classList.add('fade-out');
        document.body.classList.add('go');

        // Audio timers
        setTimeout(() => slap.play(), 2150);
        setTimeout(() => scream.play(), 2150);

        // Transition from opening animation to allow interaction 
        setTimeout(() => {
            louObject.classList.replace('opening', 'finished');
            canSlapLou = true;
        }, 3150);
    };

    overlay.addEventListener('pointerdown', begin, { once: true });

    document.addEventListener('click', () => {
        if (!canSlapLou) return;

        // Clone and play slap audio
        const slapOneShot = slap.cloneNode();
        slapOneShot.play()

        // Clone and play scream audio
        // const screamOneShot = scream.cloneNode();
        // screamOneShot.play()

        // Randomize squish X and Y instead of static scaling
        const squishX = 1.5 + Math.random() * 1.1;
        const squishY = 0.05 + Math.random() * 0.1;
        louObject.style.setProperty('--squish-x', squishX);
        louObject.style.setProperty('--squish-y', squishY);

        // Restart squish animation
        louObject.classList.remove('squish-manual');
        void louObject.offsetWidth;
        louObject.classList.add('squish-manual');
    });
</script>
</body>
</html>
